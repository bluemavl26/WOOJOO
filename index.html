<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>별바다 항해</title>
<style>
:root{
  --deep:#050d28; --ink:#eaf4ff; --dim:#8fa8d4;
  --cyan:#63e0e8; --mint:#7ef0c3; --pink:#f3a8d8; --violet:#b39bff; --gold:#ffe08a;
  --panel:rgba(10,26,64,.62); --line:rgba(150,210,255,.24);
  --ui:1;                                     /* JS가 해상도에 맞춰 넣는 UI 배율 */
  --st:calc(10px + env(safe-area-inset-top));
  --sr:calc(10px + env(safe-area-inset-right));
  --sb:calc(10px + env(safe-area-inset-bottom));
  --sl:calc(10px + env(safe-area-inset-left));
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--deep);
  font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
canvas#game{position:fixed;inset:0;display:block;cursor:crosshair}
canvas#game.hidecur{cursor:none}
.hud{position:fixed;pointer-events:none;z-index:5}
.glass{background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 30px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.05) inset}

#counter{top:var(--st);left:var(--sl);display:flex;align-items:center;
  gap:calc(12px*var(--ui));border-radius:calc(20px*var(--ui));
  padding:calc(11px*var(--ui)) calc(20px*var(--ui)) calc(11px*var(--ui)) calc(13px*var(--ui));
  max-width:calc(100vw - var(--sl) - var(--sr))}
#counter > div{min-width:0}
.zline b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zbadge{width:calc(42px*var(--ui));height:calc(42px*var(--ui));flex:none;
  border-radius:calc(14px*var(--ui));display:grid;place-content:center;
  line-height:1;font-size:calc(9px*var(--ui));letter-spacing:1px;color:#0a1830;font-weight:700;
  background:linear-gradient(150deg,#9ff0e0,#63e0e8);box-shadow:0 4px 14px rgba(99,224,232,.4)}
.zbadge b{font-size:calc(19px*var(--ui));display:block;text-align:center;margin-top:1px}
.zline{display:flex;align-items:baseline;gap:7px;margin-bottom:calc(5px*var(--ui))}
.zline b{font-size:calc(16px*var(--ui));letter-spacing:-.3px}
.zline u{text-decoration:none;font-size:calc(9.5px*var(--ui));color:var(--dim);letter-spacing:1.4px}
#counter small{color:var(--dim);font-size:calc(11px*var(--ui));font-weight:400;display:block;
  margin-top:calc(4px*var(--ui))}
#counter small b{color:var(--gold);font-weight:700;margin-left:5px;
  text-shadow:0 0 10px rgba(255,224,138,.6)}
.bar{width:calc(132px*var(--ui));height:calc(5px*var(--ui));border-radius:9px;
  background:rgba(255,255,255,.13);overflow:hidden}

/* 레벨업 배너 */
#levelup{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.9);z-index:28;
  text-align:center;opacity:0;pointer-events:none;transition:.5s cubic-bezier(.2,1,.3,1)}
#levelup.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#levelup .lv{font-size:clamp(10px,2.6vmin,13px);letter-spacing:5px;color:var(--cyan);margin-bottom:10px}
#levelup .ttl{font-size:clamp(26px,7.6vmin,44px);font-weight:800;letter-spacing:-1.5px;
  text-shadow:0 0 34px rgba(120,230,255,.8),0 6px 26px rgba(0,0,0,.7)}
#levelup .go{margin-top:13px;font-size:clamp(14px,3.4vmin,18px);color:#cfe2ff}
#levelup .go b{color:var(--mint)}
#levelup .warn{margin-top:14px;display:inline-block;font-size:clamp(11px,2.7vmin,13.5px);
  color:#ffd9e2;background:rgba(200,40,80,.26);border:1px solid rgba(255,140,170,.5);
  border-radius:999px;padding:7px 16px}
#levelup .warn b{color:#7ef0c3}
.bar i{display:block;height:100%;width:0;border-radius:9px;
  background:linear-gradient(90deg,var(--cyan),var(--mint));transition:width .6s cubic-bezier(.2,.9,.2,1)}

#tools{top:var(--st);right:var(--sr);display:flex;gap:calc(8px*var(--ui));pointer-events:auto}
.btn{border-radius:999px;padding:calc(9px*var(--ui)) calc(17px*var(--ui));
  font-size:calc(14px*var(--ui));font-weight:600;cursor:pointer;
  color:var(--ink);transition:.18s;font-family:inherit;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center}
@media (pointer:coarse){                      /* 손가락으로 누르는 기기는 44px 이상 확보 */
  .btn{min-height:44px;min-width:44px;padding-top:0;padding-bottom:0}
  .btn.icon{width:44px;height:44px}
}
.btn:hover{background:rgba(40,90,170,.7);transform:translateY(-1px)}
.btn:active{transform:scale(.95)}
.btn.icon{width:calc(40px*var(--ui));padding:0;height:calc(40px*var(--ui));font-size:calc(16px*var(--ui))}

#map{right:var(--sr);bottom:var(--sb);width:var(--radar);text-align:center}
#radar{width:var(--radar);height:var(--radar);display:block;filter:drop-shadow(0 8px 26px rgba(0,0,0,.55))}
#sector{margin-top:5px;font-size:calc(10.5px*var(--ui));color:var(--dim);letter-spacing:1.6px}

#hint{left:50%;bottom:var(--sb);transform:translateX(-50%);font-size:calc(15px*var(--ui));
  color:#c3d8ff;padding:calc(9px*var(--ui)) calc(20px*var(--ui));border-radius:999px;
  transition:opacity 1s;text-align:center;line-height:1.5;word-break:keep-all;
  max-width:min(calc(100vw - 28px), 780px)}

/* 아주 좁은 화면(≤390px)에서는 HUD를 줄여 도구 버튼과 겹치지 않게 */
@media (max-width:390px){
  #counter{gap:calc(8px*var(--ui));
    padding:calc(9px*var(--ui)) calc(13px*var(--ui)) calc(9px*var(--ui)) calc(10px*var(--ui))}
  .zline u{display:none}                       /* 영문 부제는 생략 */
  #counter small .tot{display:none}            /* 전체 수집 수는 도감에서 */
  .bar{width:calc(100px*var(--ui))}
}

/* 우주지도와 힌트가 겹치는 좁은/낮은 화면 */
@media (max-width:640px){
  /* 우주지도(+아래 SECTOR 글자)를 넉넉히 피해서 올립니다 */
  #hint{bottom:calc(var(--sb) + var(--radar) + 42px)}
}
@media (max-height:430px){                     /* 가로로 누운 폰 */
  #hint{bottom:calc(var(--sb) + 2px);left:calc(50% - var(--radar)/2 - 8px)}
}

/* ── 체력 ── */
.hearts{display:flex;gap:3px;margin-top:calc(7px*var(--ui));font-size:calc(14px*var(--ui));line-height:1}
.hearts span{color:#ff6f91;text-shadow:0 0 9px rgba(255,110,150,.85);
  transition:color .3s,text-shadow .3s;display:inline-block}
.hearts span.off{color:#2c3a5c;text-shadow:none}
.hearts span.hit{animation:hbeat .55s cubic-bezier(.2,1.3,.3,1)}
@keyframes hbeat{0%{transform:scale(1)}26%{transform:scale(1.65) rotate(-9deg)}100%{transform:scale(1)}}

/* 피격 플래시 */
#dmg{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .5s ease;
  background:radial-gradient(circle at 50% 50%,rgba(255,40,80,0) 38%,rgba(255,36,76,.62) 100%)}
#dmg.on{opacity:1;transition:opacity .05s}
#dmg.hard{background:radial-gradient(circle at 50% 50%,rgba(255,40,80,0) 18%,rgba(255,28,70,.88) 100%)}

/* 표류(기절) */
#down{position:fixed;inset:0;z-index:34;display:none;place-items:center;text-align:center;
  pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(40,8,20,.5),rgba(2,4,14,.93))}
#down.on{display:grid;animation:fadeIn .45s ease}
#down .t{font-size:clamp(22px,6.4vmin,36px);font-weight:800;letter-spacing:-1.2px;
  text-shadow:0 0 32px rgba(255,120,150,.75),0 6px 26px rgba(0,0,0,.7)}
#down .s{margin-top:13px;font-size:clamp(14px,3.4vmin,18px);color:#cfe2ff;padding:0 18px}
#down .s b{color:var(--mint)}
#down .dots{margin-top:16px;font-size:12px;letter-spacing:5px;color:#8fa8d4}

/* ── 우주의 비밀 (6성역 열쇠 3개 완성) ── */
#secret{position:fixed;inset:0;z-index:36;display:none;overflow-y:auto;touch-action:pan-y;
  background:radial-gradient(ellipse at 50% 18%,rgba(60,52,140,.55),rgba(2,2,10,.97) 62%),#02020a;
  padding:calc(var(--st) + 22px) max(18px,var(--sr)) calc(var(--sb) + 44px) max(18px,var(--sl))}
#secret.on{display:block;animation:fadeIn .7s ease}
.sbox{max-width:620px;margin:0 auto;text-align:center}
.skeys{display:flex;justify-content:center;gap:clamp(2px,2vw,14px);margin-bottom:10px}
.skeys img{width:clamp(72px,21vw,104px);height:clamp(72px,21vw,104px);
  filter:drop-shadow(0 0 22px rgba(255,216,106,.55));animation:float 3.8s ease-in-out infinite}
.skeys img:nth-child(2){animation-delay:.5s}
.skeys img:nth-child(3){animation-delay:1s}
.slv{font-size:clamp(9px,2.3vmin,10.5px);letter-spacing:4px;color:#ffd86a;opacity:.85}
#secret h2{font-size:clamp(28px,8vmin,44px);font-weight:800;letter-spacing:-1.4px;margin:8px 0 6px;
  text-shadow:0 0 40px rgba(255,216,106,.55),0 6px 28px rgba(0,0,0,.8)}
.sq{font-size:clamp(15px,3.7vmin,18px);color:#bcd0ff;margin-bottom:28px;word-break:keep-all}
#secret p{font-size:clamp(15.5px,3.9vmin,18px);line-height:1.95;color:#dfe8ff;
  word-break:keep-all;margin:0 auto 18px;max-width:34em;text-align:left;
  opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,1,.3,1)}
#secret p b{color:#ffe08a;font-weight:700}
#secret p.last{text-align:center;font-size:clamp(14.5px,3.8vmin,17.5px);color:#fff;
  margin-top:28px;line-height:1.85;text-shadow:0 0 26px rgba(170,200,255,.45)}
#secret.go p{opacity:1;transform:none}
.sclose{margin-top:16px;background:rgba(255,216,106,.14);border:1px solid rgba(255,216,106,.5);
  color:#ffe8b0;opacity:0;pointer-events:auto;transition:opacity .8s ease 4.4s}
#secret.go .sclose{opacity:1}
@media (prefers-reduced-motion:reduce){
  #secret p,.sclose{transition:none;opacity:1;transform:none}
  .skeys img{animation:none}
}

/* ── 카드 ── */
#cardWrap{position:fixed;inset:0;display:none;place-items:center;z-index:20;pointer-events:none;
  background:radial-gradient(circle at 50% 46%,rgba(20,50,110,.5),rgba(3,8,24,.88))}
#cardWrap.on{display:grid;pointer-events:auto;cursor:pointer}
/* 닫히는 0.32초 동안 투명한 레이어가 탭을 가로채지 않게 */
#cardWrap.closing{pointer-events:none}
#cardWrap.overdex{z-index:32}
.card{width:min(calc(100vw - 28px),360px);
  padding:28px 26px 22px;border-radius:28px;text-align:center;position:relative;
  background:linear-gradient(168deg,rgba(28,58,118,.95),rgba(8,18,46,.98));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 28px 80px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06) inset;
  animation:pop .62s cubic-bezier(.16,1.2,.3,1) both}
@keyframes pop{0%{transform:scale(.32) rotateY(150deg);opacity:0}
  62%{transform:scale(1.05) rotateY(-7deg);opacity:1}100%{transform:scale(1) rotateY(0)}}
.card.out{animation:fadeOut .34s ease forwards}
@keyframes fadeOut{to{transform:scale(.86) translateY(-20px);opacity:0}}
.card .orb{width:min(140px,27vh);height:min(140px,27vh);margin:0 auto 14px;background-size:contain;
  background-repeat:no-repeat;background-position:center;animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tag{display:inline-block;font-size:13px;letter-spacing:1.6px;padding:5px 15px;border-radius:99px;
  border:1px solid currentColor;margin-bottom:11px}
.card h2{font-size:34px;letter-spacing:-.8px;margin-bottom:3px;line-height:1.2;word-break:keep-all}
.card .en{font-size:14px;color:var(--dim);letter-spacing:1.6px;margin-bottom:17px}
.stats{display:grid;gap:1px;background:rgba(255,255,255,.1);border-radius:12px;overflow:hidden;
  margin-bottom:16px;font-size:15px}
.stats div{display:flex;gap:10px;background:rgba(10,22,52,.85);padding:10px 14px;text-align:left}
.stats span{color:var(--dim);width:52px;flex:none}
.stats em{font-style:normal;flex:1}
.card p{font-size:16.5px;line-height:1.78;color:#dce9ff;word-break:keep-all}
.cardhint{margin-top:16px;font-size:13px;color:#9fb4de;letter-spacing:.4px}
.cardhint b{color:var(--mint);font-weight:700}
.stats em{word-break:keep-all}
.newbadge{position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(-4deg);
  background:linear-gradient(90deg,#ffe08a,#ff9d5c);color:#3a1d00;font-size:13.5px;font-weight:800;
  padding:6px 17px;border-radius:99px;letter-spacing:1px;box-shadow:0 4px 16px rgba(255,190,90,.5)}
/* 화면이 낮으면 카드 안에서 스크롤 (뱃지는 카드 안쪽으로) */
@media (max-height:640px){
  .card{max-height:calc(100dvh - 24px);overflow-y:auto;padding-top:32px;touch-action:pan-y}
  .card .orb{width:min(118px,22vh);height:min(118px,22vh)}
  .newbadge{top:7px}
}

/* ── 도감 ── */
#dex{position:fixed;inset:0;z-index:30;display:none;background:rgba(4,10,28,.95);
  backdrop-filter:blur(16px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:calc(var(--st) + 16px) max(14px,var(--sr)) calc(var(--sb) + 50px) max(14px,var(--sl))}
#dex.on{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dexhead{max-width:920px;margin:0 auto 20px;display:flex;align-items:baseline;gap:14px;
  flex-wrap:wrap;position:sticky;top:0;z-index:2;
  background:linear-gradient(180deg,rgba(4,10,28,.98) 70%,rgba(4,10,28,0));
  padding-bottom:10px}
.dexhead h1{font-size:clamp(22px,5vmin,30px);letter-spacing:-.6px}
.dexhead span{color:var(--dim);font-size:clamp(13px,3vmin,15px)}
.dexhead .btn{pointer-events:auto;background:var(--panel);border:1px solid var(--line)}
.dexhead #btnClose{margin-left:auto}
.dexhead #btnSecret{margin-left:auto;background:rgba(255,216,106,.14);
  border-color:rgba(255,216,106,.45);color:#ffe8b0}
.dexhead #btnSecret:not([hidden]) ~ #btnClose{margin-left:0}
.g{display:grid;
  grid-template-columns:repeat(auto-fill,minmax(clamp(104px,28vw,136px),1fr));
  gap:clamp(9px,2vw,13px)}
.zsec{max-width:920px;margin:0 auto 30px}
.zhead{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.zhead b{font-size:19px}
.zhead u{text-decoration:none;font-size:12px;color:var(--dim);letter-spacing:1.6px}
.zhead .p{margin-left:auto;font-size:14px;color:var(--dim)}
.zhead .lockmark{font-size:11px;color:#6f83ab;border:1px solid rgba(150,180,230,.3);
  border-radius:99px;padding:2px 10px}
.zhead .done{font-size:11px;color:#0a1830;background:linear-gradient(90deg,#9ff0e0,#63e0e8);
  border-radius:99px;padding:3px 11px;font-weight:700}
.cell{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);
  border-radius:18px;padding:14px 8px 12px;text-align:center;transition:.2s;cursor:default}
.cell.got{background:rgba(40,80,165,.22);cursor:pointer}
.cell.got:active{transform:scale(.96)}
.cell.got:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.34)}
.cell .o{width:62px;height:62px;margin:0 auto 10px;background-size:contain;
  background-repeat:no-repeat;background-position:center}
.cell b{display:block;font-size:15px;font-weight:600;word-break:keep-all;line-height:1.3}
.cell i{display:block;font-size:12px;color:var(--dim);font-style:normal;margin-top:3px}
.cell.lock .o{background:rgba(255,255,255,.06);border-radius:50%}
.cell.lock b{color:#3d4f74}
.cnt{position:absolute;right:-6px;top:-4px;background:var(--gold);color:#2a1800;font-size:10px;
  font-weight:800;border-radius:99px;padding:1px 6px}
/* 도감에서 별을 누르면 잡았을 때와 같은 카드가 뜹니다 (#cardWrap.overdex) */
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud glass" id="counter">
  <div class="zbadge">LV<b id="zoneNum">1</b></div>
  <div style="text-align:left">
    <div class="zline"><b id="zoneName">태양계</b><u id="zoneSub">SOLAR SYSTEM</u></div>
    <div class="bar"><i id="cBar"></i></div>
    <small><span id="cGot">0</span> / <span id="cAll">0</span> 종 수집<span class="tot"> · 전체 <span id="cTotal">0</span></span><b id="cLeft"></b></small>
    <div class="hearts" id="hearts"></div>
  </div>
</div>

<div id="levelup"></div>
<div id="dmg"></div>
<div id="down">
  <div>
    <div class="t">우주복이 망가졌어요</div>
    <div class="s">잠시 뒤 <b>다시 날아오릅니다</b> · 모은 별은 그대로예요</div>
    <div class="dots" id="downDots">· · ·</div>
  </div>
</div>

<div class="hud" id="tools">
  <button class="btn glass" id="btnDex">도감</button>
  <button class="btn glass icon" id="btnSound" title="소리">🔊</button>
</div>

<div class="hud" id="map">
  <canvas id="radar" width="304" height="304"></canvas>
  <div id="sector">SECTOR 0 : 0</div>
</div>

<div class="hud glass" id="hint"><span id="hintTxt"></span></div>

<div id="cardWrap"><div class="card" id="card"></div></div>

<div id="secret"></div>

<div id="dex">
  <div class="dexhead">
    <h1>우주 도감</h1><span id="dexCount"></span>
    <button class="btn" id="btnSecret" hidden>🔑 우주의 비밀</button>
    <button class="btn" id="btnClose">닫기</button>
  </div>
  <div id="dexGrid"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════
   별바다 항해 — 바다가 곧 우주
   THEME 블록만 바꾸면 전체 톤이 갈아끼워집니다.
   ══════════════════════════════════════════════════════ */
const THEME = {
  seaTop:'#04091f', seaMid:'#0a1c4a', seaBot:'#10315f',
  foam:'rgba(190,240,255,.75)',
  hull:'#f3e7cf',                  // (구) 돛단배 — 지금은 우주인 스프라이트를 씁니다
  hullDark:'#c9ab7d',              // 갑판
  sail:'#ffffff',                  // 돛
  mast:'#6b543a',                  // 돛대
};
const RARITY = {
  common:{name:'흔함', color:'#ffe08a', w:60, glow:18},
  rare:  {name:'희귀', color:'#7ef0c3', w:29, glow:26},
  epic:  {name:'전설', color:'#c9a8ff', w:11, glow:36},
  myth:  {name:'신화', color:'#ffb3e6', w:0,  glow:52},   // 도하별 전용
  key:   {name:'열쇠', color:'#ffd86a', w:0,  glow:58},   // 6성역 열쇠 3개 전용
};
const DOHA_CHANCE=.015;   // 어느 성역에서든 1.5% 확률로 등장

/* ── 성역: 다 모으면 다음 은하로 워프(레벨업) ── */
const ZONES=[null,
 {name:'태양계',   sub:'SOLAR SYSTEM', sea:['#04091f','#0a1c4a','#10315f'],

/* ── 실제 지름(km) → 화면 크기 ────────────────────────

const LY=9.461e12;
const KM={
  mercury:4879, venus:12104, earth:12742, mars:6779, jupiter:139820, saturn:116460,

const zoneList=z=>CATALOG.filter(e=>e.z===z);

/* 6성역은 '전수 수집'이 아니라 '열쇠 3개'가 클리어 조건입니다 */
const KEY_ZONE=6, KEY_IDS=['key1','key2','key3'];
const keysGot=()=>KEY_IDS.filter(k=>dex[k]).length;
const zoneDone=z=> z===KEY_ZONE ? keysGot()===KEY_IDS.length
                                : zoneGot(z)===zoneList(z).length;
const ZLOG={};
for(let z=1;z<ZONES.length;z++){
  const v=zoneList(z).filter(e=>!e.px).map(e=>Math.log10(KM[e.id]||1e4));
  ZLOG[z]= v.length ? {min:Math.min(...v), max:Math.max(...v)} : {min:0,max:1};
}
const MINPX=42;
/* 성역별 '보통 천체'의 최대 크기. px 를 가진 거인들은 이 스케일 밖에서 따로 큽니다 */
const ZMAXPX={1:170, 2:300, 3:430, 4:200, 5:185, 6:260};
function sizeOf(e){
  if(e.z===0) return 260;                        // 도하별 — 압도적으로 큼
  if(e.px)   return e.px;                        // 연출용 고정 크기 (거인들)
  const L=ZLOG[e.z], t=(Math.log10(KM[e.id]||1e4)-L.min)/((L.max-L.min)||1);
  const MX=ZMAXPX[e.z]||170;
  return MINPX+(MX-MINPX)*Math.pow(Math.max(0,t),1.2);
}

/* ══════════════════════════════════════════════════════
   행성 스프라이트 — 천체마다 실제 표면을 그려서 캐시
   ══════════════════════════════════════════════════════ */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rngOf(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hx(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(a,b,t){const A=hx(a),B=hx(b);
  return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
function rgba(h,a){const c=hx(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`;}
const LIGHT='#ffffff', DARK='#050a1c';

/* 구체 음영 + 림라이트 */
function shadeSphere(g,R,c){
  const sh=g.createRadialGradient(-R*.34,-R*.40,R*.05,-R*.1,-R*.1,R*1.5);
  sh.addColorStop(0,'rgba(255,255,255,.30)');
  sh.addColorStop(.42,'rgba(255,255,255,0)');
  sh.addColorStop(.80,'rgba(4,8,26,.42)');
  sh.addColorStop(1,'rgba(2,5,18,.72)');
  g.fillStyle=sh; g.beginPath(); g.arc(0,0,R,0,7); g.fill();
  g.save(); g.beginPath(); g.arc(0,0,R,0,7); g.clip();
  g.strokeStyle=rgba(mix(c,LIGHT,.75),.55); g.lineWidth=R*.09;
  g.beginPath(); g.arc(0,0,R*.99,Math.PI*.62,Math.PI*1.28); g.stroke();
  g.restore();
}
function blobs(g,R,rnd,n,col,min,max,alpha){
  g.globalAlpha=alpha;g.fillStyle=col;
  for(let i=0;i<n;i++){
    const a=rnd()*7,d=rnd()*R*.92,x=Math.cos(a)*d,y=Math.sin(a)*d,
          w=R*(min+rnd()*(max-min)),h=w*(.45+rnd()*.7);
    g.beginPath();g.ellipse(x,y,w,h,rnd()*7,0,7);g.fill();
  }
  g.globalAlpha=1;
}
function bands(g,R,rnd,cols,n){
  for(let i=0;i<n;i++){
    const y=-R+ (2*R)*(i/n), h=(2*R)/n*(1.05+rnd()*.5);
    g.fillStyle=cols[i%cols.length];
    g.beginPath();
    g.moveTo(-R,y);
    for(let x=-R;x<=R;x+=R/6) g.lineTo(x, y+Math.sin(x*.05+i*1.7)*R*.035);
    g.lineTo(R,y+h);
    for(let x=R;x>=-R;x-=R/6) g.lineTo(x, y+h+Math.sin(x*.05+i*1.7+1)*R*.035);
    g.closePath(); g.fill();
  }
}
function craters(g,R,rnd,base,n){
  for(let i=0;i<n;i++){
    const a=rnd()*7,d=rnd()*R*.85,x=Math.cos(a)*d,y=Math.sin(a)*d,r=R*(.05+rnd()*.16);
    g.fillStyle=rgba(mix(base,DARK,.35),.55);
    g.beginPath();g.arc(x,y,r,0,7);g.fill();
    g.strokeStyle=rgba(mix(base,LIGHT,.5),.45);g.lineWidth=r*.22;
    g.beginPath();g.arc(x,y,r*.92,Math.PI*.9,Math.PI*2.1);g.stroke();
  }
}
function planetRing(g,R,c,inner,outer,tilt){
  g.save(); g.rotate(tilt); g.scale(1,.22);
  const steps=[[outer,.16],[outer*.93,.55],[outer*.80,.28],[outer*.74,.62],[inner*1.05,.30]];
  for(const [rr,al] of steps){
    g.strokeStyle=rgba(mix(c,LIGHT,.55),al); g.lineWidth=R*.10;
    g.beginPath(); g.arc(0,0,rr,0,7); g.stroke();
  }
  g.restore();
}
function sparkle(g,x,y,r,a){
  g.save(); g.translate(x,y); g.fillStyle=`rgba(255,255,255,${a})`;
  g.beginPath();
  for(let i=0;i<8;i++){ const rad=i%2?r*.22:r, ang=i/8*Math.PI*2;
    i?g.lineTo(Math.cos(ang)*rad,Math.sin(ang)*rad):g.moveTo(Math.cos(ang)*rad,Math.sin(ang)*rad); }
  g.closePath(); g.fill(); g.restore();
}
function glowDot(g,x,y,r,c,a=1){
  const gr=g.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,rgba(LIGHT,a)); gr.addColorStop(.32,rgba(c,a*.85)); gr.addColorStop(1,rgba(c,0));
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
}

const SPRITES=new Map();
function sprite(e){
  if(SPRITES.has(e.id)) return SPRITES.get(e.id);
  // 큰 천체일수록 스프라이트도 크게 그려서 확대해도 또렷하게
  const S=Math.min(440,Math.max(200,Math.ceil(sizeOf(e)*1.1/4)*4));
  const cv=document.createElement('canvas'); cv.width=cv.height=S;
  const g=cv.getContext('2d'); g.translate(S/2,S/2);
  const rnd=rngOf(hash(e.id)), c=e.c, P=e.paint;
  const WIDE={star:1,nebula:1,galaxy:1,cluster:1,comet:1,supergiant:1,pulsar:1,
              rainbow:1,darkneb:1,globular:1,dwarf:1,cosmicweb:1};
  const R = e.ring? S*.235 : WIDE[P]? S*.30 : S*.31;
  const K = Math.max(1, S/230);                  // 큰 스프라이트는 입자도 더 촘촘히

  // 뒤쪽 고리
  if(e.ring) { g.save(); planetRing(g,R,c,R*1.35,R*2.0,-.32); g.restore(); }
  if(e.id==='doha') glowDot(g,0,0,R*2.15,'#ffb3e6',.26);

  if(P==='key'){

const ASTRO_COLS = ['#dcbcf7','#aa99ec','#8885c5','#6793eb','#efe6ff'];  // 별가루 꼬리 색

const DIRK=['e','se','s','sw','w','nw','n','ne'];        // 45도 간격, 캔버스 기준 시계방향
const MIRROR={w:'e', nw:'ne', sw:'se', e:'w', ne:'nw', se:'sw'};
const ASTRO_IMG={};
for(const k in ASTRO_DIRS){
  if(!ASTRO_DIRS[k]) continue;
  const im=new Image(); im.src=ASTRO_DIRS[k]; ASTRO_IMG[k]=im;
}
/* 요청한 방향에 그림이 없으면 → 거울 방향 → 가장 가까운 각도 순으로 찾아 준다 */
const HSIGN={e:1,ne:1,se:1,w:-1,nw:-1,sw:-1,n:0,s:0};   // 그림이 바라보는 좌우
const DIRCACHE={};
function astroFor(key){
  if(DIRCACHE[key]) return DIRCACHE[key];
  let r=null;
  if(ASTRO_IMG[key]) r={img:ASTRO_IMG[key], src:key, flip:false, exact:true};
  else if(MIRROR[key] && ASTRO_IMG[MIRROR[key]])
    r={img:ASTRO_IMG[MIRROR[key]], src:MIRROR[key], flip:true, exact:true};
  else{
    const i0=DIRK.indexOf(key);
    for(let d=1;d<=4 && !r;d++){
      const cand=[DIRK[(i0+d)%8], DIRK[(i0-d+8)%8]];
      for(const k2 of cand)                      // 원본 그대로 쓸 수 있는 쪽을 먼저
        if(ASTRO_IMG[k2]){ r={img:ASTRO_IMG[k2], src:k2, flip:false, exact:false}; break; }
      if(r) break;
      for(const k2 of cand){ const m=MIRROR[k2];
        if(m && ASTRO_IMG[m]){ r={img:ASTRO_IMG[m], src:m, flip:true, exact:false}; break; } }
    }
  }
  if(!r) return null;
  if(r.exact) r.sign=HSIGN[key];
  else{                                          // 진행 방향 쪽을 보도록 한 번 더 뒤집을지 판단
    let sign=HSIGN[r.src]*(r.flip?-1:1), want=HSIGN[key];
    if(sign && want && sign!==want){ r.flip=!r.flip; sign=-sign; }
    r.sign=sign;
  }
  DIRCACHE[key]=r;
  return r;
}
/* 진행 각도 → 쓸 그림 + 좌우반전 + 기울기 */
function astroPose(a){
  const key=DIRK[((Math.round(a/(Math.PI/4))%8)+8)%8];
  const r=astroFor(key);
  if(!r) return null;
  let tilt=0;
  if(!r.exact && r.sign){                        // 대체 그림일 때만 살짝 기울여 방향감을 준다
    const pitch=Math.atan2(Math.sin(a), Math.abs(Math.cos(a)));
    tilt=Math.max(-.55,Math.min(.55,pitch*.6))*r.sign;
  }
  return {img:r.img, flip:r.flip, tilt};
}
function drawAstro(x,y,a,extraRot){
  const p=astroPose(a);
  ctx.save(); ctx.translate(x,y);
  ctx.rotate((extraRot||0)+(p?p.tilt:0));
  if(!p || !p.img.complete || !p.img.naturalWidth){        // 그림이 아직 없으면 임시 도형
    ctx.fillStyle='#aa99ec'; ctx.beginPath(); ctx.arc(0,0,16,0,7); ctx.fill();
    ctx.restore(); return;
  }
  const iw=p.img.naturalWidth, ih=p.img.naturalHeight;
  const h=ASTRO_H, w=h*iw/ih;
  if(p.flip) ctx.scale(-1,1);
  const sm=ctx.imageSmoothingEnabled; ctx.imageSmoothingEnabled=false;   // 픽셀아트는 또렷하게
  ctx.drawImage(p.img,-w/2,-h/2,w,h);
  ctx.imageSmoothingEnabled=sm;
  ctx.restore();
}

let W=0,H=0,DPR=1,VS=1,UI=1,ASTRO_H=62,TARGET_N=11,KEEP=2900,RANGE=1700,IS_TOUCH=false;
function resize(){
  const vv=window.visualViewport;
  W=Math.round(vv?vv.width:innerWidth);
  H=Math.round(vv?vv.height:innerHeight);
  DPR=clamp(devicePixelRatio||1,1,2.5);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  const m=Math.min(W,H);
  VS = clamp(m/820, .52, 1.12);                      // 월드 배율 (노트북 ≈ 1.0 기준)
  UI = clamp(.72 + m*.00058, .88, 1.24);             // HUD 배율 (어린이도 읽을 수 있게 크게)
  ASTRO_H = Math.round(38+24*VS);                    // 우주인 키
  ship.speed = 74*(.62+.38*VS);
  TARGET_N = clamp(Math.round(7+(W*H)/260000), 8, 18);
  KEEP  = Math.hypot(W,H)*1.35+900;
  RANGE = Math.max(1100, Math.hypot(W,H)*.78);

  const rs=Math.round(clamp(m*.19,96,164));          // 우주지도 크기
  const r=document.documentElement.style;
  r.setProperty('--ui',UI.toFixed(3));
  r.setProperty('--radar',rs+'px');

  for(const s of stars) s.size=s.base*VS;            // 이미 떠 있는 별도 다시 맞춘다
}

  const base=zoneList(prog.zone).filter(e=>!e.key);

  const live=new Set(stars.map(s=>s.e.id));
  let avail=pool.filter(e=>!live.has(e.id));
  if(!avail.length) avail=base.filter(e=>!live.has(e.id));
  if(!avail.length) avail=pool;
  const wt=[];
  for(const e of avail){
    const n = recent.includes(e.id) ? 1 : dex[e.id] ? 2 : 6;

    const ang = moving ? ship.a+rnd(-1.2,1.2)+(Math.random()<.22?Math.PI:0)
                       : Math.random()*Math.PI*2;
    const ca=Math.abs(Math.cos(ang)), sa=Math.abs(Math.sin(ang)); // 화면 모양에 맞춰 배치
    const edge=Math.min(ca<1e-4?1e9:(W/2)/ca, sa<1e-4?1e9:(H/2)/sa);
    const d=edge*rnd(.70,1.95)+size*.4;            // 시도할수록 조금씩 더 멀리
    x=ship.x+Math.cos(ang)*d; y=ship.y+Math.sin(ang)*d;
    ok=true;
    for(const o of stars){
      if(Math.hypot(o.x-x,o.y-y) < apart(size,o.size)){ ok=false; break; }
    }
  }
  if(!ok) return false;                            // 자리가 없으면 이번엔 거릅니다
  noteSpawn(e.id);
  stars.push({e,x,y,
    ph:Math.random()*7, ring:Math.random()*7, spin:rnd(-.22,.22),
    dx:rnd(-7,7), dy:rnd(-7,7), sc:1, caught:0, base, size});
  return true;
}
function burst(x,y,color,n=26,pw=1){
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=rnd(60,340)*pw;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.55,1.3),t:0,r:rnd(1.4,4.4)*pw,c:color}); }
}
const ripple=(x,y,c,max=200,w=3,delay=0)=>rings.push({x,y,r:14,max,t:-delay,life:1.15,c,w});
const toast=(x,y,txt,c='#9ff0d8')=>toasts.push({x,y,txt,c,t:0,life:1.25});

/* ══════════════════════════════════════════════════════
   운석 · 소행성 — 배를 위협하는 방해꾼
   ══════════════════════════════════════════════════════ */
const ROCK_COL=['#7c6f61','#6d6258','#8a7a66','#5f5750'];

/* ── 성역별 난이도 ──
   레벨이 오를수록 운석이 잦아지고, 많아지고, 커지고, 빨라진다.
   큰 운석(big/huge)에 맞으면 하트가 2개 깎인다. */
const DIFF={
/*        간격  최대  큰것   초대형  속도  */
  1:{gap:4.4, max: 8, big:.24, huge:.00, spd:1.00},
  2:{gap:3.7, max:10, big:.38, huge:.12, spd:1.08},
  3:{gap:3.0, max:12, big:.50, huge:.22, spd:1.17},
  4:{gap:2.4, max:15, big:.62, huge:.34, spd:1.28},
  5:{gap:2.3, max:16, big:.64, huge:.36, spd:1.33},
};
const diff=()=>DIFF[prog.zone]||DIFF[5];
const UFO_ZONE=5;                  // UFO가 나타나는 성역
const UFO_DMG=3;                   // 부딪히면 하트 3개
const BEAM_DMG=1;                  // UFO가 쏘는 광선은 하트 1개
const BEAM_CHARGE=.95;             // 조준선을 보여주는 시간(초) — 이 사이에 피하면 됩니다

function spawnRock(){
  const Q=diff();
  const D=Math.hypot(W,H)*.60+160;                 // 화면 밖에서 출발
  const a=Math.random()*Math.PI*2;
  const sx=ship.x+Math.cos(a)*D, sy=ship.y+Math.sin(a)*D;
  const big=Math.random()<Q.big;
  const huge=big&&Math.random()<Q.huge;            // 덩치 큰 놈들
  const rk=.62+.38*VS;                             // 작은 화면에선 운석도 작게
  const r=(huge?rnd(50,72):big?rnd(32,47):rnd(15,27))*rk;
  const v=(huge?rnd(98,142):big?rnd(122,180):rnd(170,255))*(.68+.32*VS)*Q.spd;
  /* 배의 진로를 '어느 정도만' 예측해서 조준 —
     그냥 직진하면 맞고, 방향을 틀면 피할 수 있는 난이도 */
  const aimed=Math.random()<.62;                  // 절반 남짓은 제대로 조준, 나머지는 스쳐 지나감
  /* 요격 시점 t 를 이차방정식으로 정확히 구한다 (|P + Vt·t| = v·t) */
  const sp=ship.speed*ship.boost, lead=aimed?rnd(.94,1.03):rnd(.45,.88);
  const pxr=ship.x-sx, pyr=ship.y-sy;
  const vtx=Math.cos(ship.a)*sp*lead, vty=Math.sin(ship.a)*sp*lead;
  const A=vtx*vtx+vty*vty-v*v, B=2*(pxr*vtx+pyr*vty), C=pxr*pxr+pyr*pyr;
  let t=D/v;
  if(Math.abs(A)<1e-4){ if(B) t=-C/B; }
  else{ const disc=B*B-4*A*C;
    if(disc>=0){ const sq=Math.sqrt(disc);
      const c1=(-B+sq)/(2*A), c2=(-B-sq)/(2*A);
      const ok=[c1,c2].filter(x=>x>.2&&x<40);
      if(ok.length) t=Math.min(...ok); } }
  const oa=Math.random()*Math.PI*2, od=aimed?rnd(0,16):rnd(85,230);
  let tx=ship.x+vtx*t+Math.cos(oa)*od, ty=ship.y+vty*t+Math.sin(oa)*od;
  const dir=Math.atan2(ty-sy,tx-sx);
  const g=rngOf(hash('rock'+Math.random()));
  const n=9+((g()*4)|0), pts=[];
  for(let i=0;i<n;i++){ const ang=i/n*Math.PI*2, rr=r*(.70+g()*.44);
    pts.push([Math.cos(ang)*rr,Math.sin(ang)*rr]); }
  const cr=[];
  for(let i=0;i<4;i++){ const ang=g()*7, d=g()*r*.55;
    cr.push([Math.cos(ang)*d,Math.sin(ang)*d,r*(.10+g()*.16)]); }
  rocks.push({x:sx,y:sy,vx:Math.cos(dir)*v,vy:Math.sin(dir)*v,r,big,huge,pts,cr,
    dmg: big?2:1,                                   // 큰 운석은 하트 2개
    col:ROCK_COL[(g()*4)|0], rot:g()*7, spin:rnd(-1.2,1.2*(huge?.6:1)), near:0, grazed:0});
}

/* 피격 */
function hitShip(k){
  if(inv>0||downT>0) return;
  const dmg=k.dmg||1;
  hp=Math.max(0,hp-dmg); inv=dmg>1?2.3:1.9;
  shake=Math.min(1.5,shake+(k.huge?1.45:k.big?1.15:.8));
  burst(k.x,k.y,'#d9c8b0',k.huge?58:k.big?42:26,k.huge?1.7:k.big?1.35:1);
  ripple(k.x,k.y,'#ff8aa0',k.huge?420:k.big?320:240,3.4);
  ripple(ship.x,ship.y,'#ffffff',150,2,.05);
  dmgFlash(dmg>1); updateHearts(true,dmg);
  toast(ship.x,ship.y-38,'-'+dmg+' ♥','#ff8aa0');
  beep(150,.3,'sawtooth',.15); beep(88,.46,'square',.10,.03);
  if(dmg>1) beep(62,.5,'square',.12,.06);          // 큰 충격은 한 번 더 묵직하게
  if(hp<=0) goDown();
}
/* ══════════════════════════════════════════════════════
   UFO — 성역 5 '마음의 우주'에만 나타나는 방해꾼
   운석처럼 날아가는 게 아니라 우주인을 천천히 쫓아옵니다.
   전속력으로 달아나면 반드시 따돌릴 수 있는 속도예요.
   부딪히면 하트 3개 — 멀리서부터 눈에 띄게 알려줍니다.
   ══════════════════════════════════════════════════════ */
let ufoTimer=11;
function spawnUfo(){
  const D=Math.hypot(W,H)*.66+200, a=Math.random()*Math.PI*2;
  ufos.push({ x:ship.x+Math.cos(a)*D, y:ship.y+Math.sin(a)*D,
    vx:0, vy:0, r:34*(.62+.38*VS), ph:Math.random()*7, tilt:0,
    born:0, near:0, grazed:0,
    charge:0, cool:rnd(2.0,3.6), ax:1, ay:0 });
}
function updateUfos(dt){
  if(prog.zone!==UFO_ZONE||warp){ ufos.length=0; beams.length=0; return; }
  ufoTimer-=dt;
  if(ufoTimer<=0){ ufoTimer=rnd(10,16); if(ufos.length<2) spawnUfo(); }

  const CHASE=ship.speed*1.25;                 // 우주인 전속력(약 3배)보다 한참 느림
  const LIMIT=Math.hypot(W,H)*.95+700;
  for(let i=ufos.length-1;i>=0;i--){
    const u=ufos[i]; u.ph+=dt*2.1; u.born+=dt;
    const dx=ship.x-u.x, dy=ship.y-u.y, d=Math.hypot(dx,dy)||1;
    u.vx=lerp(u.vx,dx/d*CHASE,1-Math.pow(.2,dt));   // 스르륵 방향을 바꾸며 따라온다
    u.vy=lerp(u.vy,dy/d*CHASE,1-Math.pow(.2,dt));
    u.x+=u.vx*dt+Math.cos(u.ph*.63)*22*dt;          // 좌우로 흔들흔들
    u.y+=u.vy*dt+Math.sin(u.ph)*17*dt;
    u.tilt=lerp(u.tilt,Math.max(-.3,Math.min(.3,u.vx/(ship.speed*3))),1-Math.pow(.1,dt));

    if(d>LIMIT && u.born>6){ ufos.splice(i,1); continue; }
    if(!cardOpen && d < u.r*.62+ASTRO_H*.26){        // 충돌!
      if(inv>0){ burst(u.x,u.y,'#9ff0d8',16,.8); beep(520,.07,'sine',.04); }
      else hitUfo(u);
      ufos.splice(i,1); continue;
    }
    if(d<u.r+ASTRO_H*.9) u.near=1;
    else if(u.near && !u.grazed){ u.grazed=1; grazeRock(u); }

    /* ── 공격 ──
       조준선을 0.95초 보여준 뒤 그 방향으로 광선을 쏩니다.
       조준은 '겨눈 순간'의 위치로 고정되니, 옆으로 비키면 빗나가요. */
    if(cardOpen||inv>0){ u.charge=0; continue; }
    if(u.charge>0){
      u.charge+=dt;
      if(u.charge>=BEAM_CHARGE){ fireBeam(u); u.charge=0; u.cool=rnd(3.2,5.0); }
    } else {
      u.cool-=dt;
      if(u.cool<=0 && u.born>2.5 && d<Math.min(W,H)*.62){
        u.charge=.0001; u.ax=dx/d; u.ay=dy/d;         // 지금 위치로 조준 고정
        beep(300,.5,'sawtooth',.05); beep(460,.5,'sine',.035,.08);
      }
    }
  }
  updateBeams(dt);
}
function fireBeam(u){
  const v=380*(.68+.32*VS);
  beams.push({ x:u.x+u.ax*u.r*.7, y:u.y+u.ay*u.r*.7,
    vx:u.ax*v, vy:u.ay*v, r:9*(.65+.35*VS), t:0, a:Math.atan2(u.ay,u.ax) });
  burst(u.x+u.ax*u.r*.8, u.y+u.ay*u.r*.8, '#9ff0d8', 10, .6);
  beep(880,.09,'square',.09); beep(420,.16,'sawtooth',.07,.04);
}
function updateBeams(dt){
  const LIMIT=Math.hypot(W,H)*.9+500;
  for(let i=beams.length-1;i>=0;i--){
    const b=beams[i]; b.t+=dt;
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    const d=Math.hypot(b.x-ship.x,b.y-ship.y);
    if(d>LIMIT || b.t>7){ beams.splice(i,1); continue; }
    if(!cardOpen && d < b.r+ASTRO_H*.26){
      if(inv>0){ burst(b.x,b.y,'#9ff0d8',10,.6); beep(520,.07,'sine',.04); }
      else hitBeam(b);
      beams.splice(i,1);
    }
  }
}
function hitBeam(b){
  if(inv>0||downT>0) return;
  hp=Math.max(0,hp-BEAM_DMG); inv=1.9; shake=Math.min(1.3,shake+.85);
  burst(b.x,b.y,'#9ff0d8',26,1);
  ripple(ship.x,ship.y,'#8ff0d0',220,2.6);
  dmgFlash(false); updateHearts(true,BEAM_DMG);
  toast(ship.x,ship.y-38,'-'+BEAM_DMG+' ♥','#8ff0d0');
  beep(200,.22,'square',.12); beep(130,.3,'sawtooth',.09,.08);
  if(hp<=0) goDown();
}
/* 조준선 — 쏘기 전에 어디로 올지 분명히 보여줍니다 */
function drawAim(u){
  if(u.charge<=0) return;
  const k=Math.min(1,u.charge/BEAM_CHARGE), blink=.5+.5*Math.sin(tG*26);
  const L=Math.min(W,H)*.75;
  const x0=u.x+u.ax*u.r*.7, y0=u.y+u.ay*u.r*.7;
  ctx.save();
  ctx.setLineDash([14,11]); ctx.lineDashOffset=-tG*90;
  ctx.strokeStyle=`rgba(255,120,120,${(.22+k*.45*blink).toFixed(2)})`;
  ctx.lineWidth=1.6+k*1.8;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0+u.ax*L,y0+u.ay*L); ctx.stroke();
  ctx.setLineDash([]);
  const g=ctx.createRadialGradient(x0,y0,1,x0,y0,u.r*(.3+k*.55));   // 모이는 빛
  g.addColorStop(0,`rgba(220,255,245,${(.5+k*.5).toFixed(2)})`);
  g.addColorStop(1,'rgba(130,240,210,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x0,y0,u.r*(.3+k*.55),0,7); ctx.fill();
  ctx.restore();
}
function drawBeam(b){
  const tail=26+b.r*2.2;
  ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.a);
  const tg=ctx.createLinearGradient(0,0,-tail,0);
  tg.addColorStop(0,'rgba(170,255,230,.85)'); tg.addColorStop(1,'rgba(120,240,200,0)');
  ctx.fillStyle=tg; ctx.beginPath(); ctx.ellipse(-tail/2,0,tail/2,b.r*.55,0,0,7); ctx.fill();
  const g=ctx.createRadialGradient(0,0,1,0,0,b.r*2.2);
  g.addColorStop(0,'rgba(240,255,250,.95)');
  g.addColorStop(.42,'rgba(140,245,210,.72)');
  g.addColorStop(1,'rgba(110,235,195,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,b.r*2.2,0,7); ctx.fill();
  ctx.fillStyle='#f2fffb'; ctx.beginPath(); ctx.arc(0,0,b.r*.52,0,7); ctx.fill();
  ctx.restore();
}
function hitUfo(u){
  if(inv>0||downT>0) return;
  hp=Math.max(0,hp-UFO_DMG); inv=3.0; shake=1.5;
  burst(u.x,u.y,'#8ff0d0',54,1.5);
  ripple(u.x,u.y,'#7ef0c3',460,4);
  ripple(ship.x,ship.y,'#ffffff',200,2.4,.05);
  dmgFlash(true); updateHearts(true,UFO_DMG);
  toast(ship.x,ship.y-38,'-'+UFO_DMG+' ♥','#8ff0d0');
  beep(180,.12,'square',.13); beep(120,.18,'square',.12,.11);
  beep(76,.55,'sawtooth',.14,.22);
  if(hp<=0) goDown();
}
function drawUfo(u){
  const R=u.r, bob=Math.sin(u.ph*.8)*3.2;
  ctx.save(); ctx.translate(u.x,u.y+bob); ctx.rotate(u.tilt);

  const beam=ctx.createRadialGradient(0,R*.5,2,0,R*.5,R*2.1);   // 아래로 퍼지는 빛
  beam.addColorStop(0,'rgba(140,245,210,.30)');
  beam.addColorStop(1,'rgba(120,240,200,0)');
  ctx.fillStyle=beam; ctx.beginPath(); ctx.ellipse(0,R*.5,R*1.7,R*1.25,0,0,7); ctx.fill();

  ctx.fillStyle='rgba(150,255,220,.16)';                        // 접시 아래 그림자
  ctx.beginPath(); ctx.ellipse(0,R*.30,R*1.02,R*.30,0,0,7); ctx.fill();

  const dome=ctx.createLinearGradient(0,-R*.82,0,-R*.06);       // 유리 돔
  dome.addColorStop(0,'rgba(210,255,245,.95)');
  dome.addColorStop(.55,'rgba(120,225,210,.85)');
  dome.addColorStop(1,'rgba(60,140,150,.85)');
  ctx.fillStyle=dome; ctx.beginPath(); ctx.ellipse(0,-R*.06,R*.46,R*.48,0,Math.PI,0); ctx.fill();

  const hull=ctx.createLinearGradient(0,-R*.2,0,R*.28);         // 금속 접시
  hull.addColorStop(0,'#cfe6e2'); hull.addColorStop(.42,'#8aa8ad');
  hull.addColorStop(.62,'#5e7880'); hull.addColorStop(1,'#33454f');
  ctx.fillStyle=hull; ctx.beginPath(); ctx.ellipse(0,0,R,R*.30,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(225,255,250,.5)'; ctx.lineWidth=Math.max(1,R*.035);
  ctx.beginPath(); ctx.ellipse(0,-R*.03,R*.93,R*.22,0,0,7); ctx.stroke();

  for(let i=0;i<7;i++){                                          // 도는 불빛
    const a=u.ph*1.5+i/7*Math.PI*2, sx=Math.cos(a)*R*.80, sy=Math.sin(a)*R*.22+R*.09;
    const k=.35+.65*(Math.sin(a)*.5+.5);
    ctx.fillStyle=`rgba(255,${200+((55*k)|0)},${(140+90*k)|0},${(.35+k*.6).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(sx,sy,R*.072*(.6+k*.7),0,7); ctx.fill();
  }
  ctx.restore();
}

/* ══════════════════════════════════════════════════════
   열쇠 찾기 — 성역 6 '처음의 우주'
   항해하다 보면 한 번씩 열쇠 행성이 나타납니다. 한 번 나타나면
   멀어져도 사라지지 않고, 우주지도와 화면 끝 화살표가 자리를 알려줘요.
   ══════════════════════════════════════════════════════ */
let keyTimer=rnd(55,80);
function spawnKey(e){
  sprite(e);
  const ang=Math.random()*Math.PI*2, d=Math.hypot(W,H)*.55+rnd(260,620);
  const base=sizeOf(e);
  stars.push({e, key:1, x:ship.x+Math.cos(ang)*d, y:ship.y+Math.sin(ang)*d,
    ph:Math.random()*7, ring:0, spin:0, dx:rnd(-4,4), dy:rnd(-4,4),
    sc:1, caught:0, base, size:base*VS});
  toast(ship.x,ship.y-46,'열쇠의 기운이 느껴져요…','#ffd86a');
  if(sound)[784,988,1319].forEach((f,i)=>beep(f,.26,'sine',.07,i*.13));
}
function updateKeys(dt){
  if(prog.zone!==KEY_ZONE||warp||downT>0) return;
  const next=KEY_IDS.find(k=>!dex[k] && !stars.some(s=>s.e.id===k));
  if(!next){ return; }                       // 이미 떠 있거나 다 모았으면 쉬어 갑니다
  keyTimer-=dt;
  if(keyTimer<=0){ keyTimer=rnd(75,150); spawnKey(BY_ID[next]); }
}

/* 아슬아슬 회피 */
let lastGraze=-9;
function grazeRock(k){
  if(tG-lastGraze>2.2){ lastGraze=tG; toast(ship.x,ship.y-34,'아슬아슬!','#9ff0d8'); }
  ripple(ship.x,ship.y,'#7ef0c3',120,1.6);
  for(let i=0;i<7;i++){ const a=Math.random()*7;
    parts.push({x:ship.x,y:ship.y,vx:Math.cos(a)*rnd(40,110),vy:Math.sin(a)*rnd(40,110),
      life:rnd(.3,.6),t:0,r:rnd(1,2.4),c:'#9ff0d8'}); }
  beep(940,.09,'sine',.05); beep(1240,.1,'sine',.04,.05);
}

/* 표류(기절) → 부활 */
const downEl=()=>document.getElementById('down');
function goDown(){
  downT=3.6; target=null; rocks.length=0; ufos.length=0; beams.length=0; hideCard(true);
  burst(ship.x,ship.y,'#ffd9a0',58,1.5);
  ripple(ship.x,ship.y,'#ff8aa0',520,5);
  ripple(ship.x,ship.y,'#ffffff',360,3,.12);
  shake=1.3;
  downEl().classList.add('on');
  if(sound)[330,262,196,147].forEach((f,i)=>beep(f,.55,'triangle',.12,i*.19));
}
function revive(){
  downT=0; hp=MAXHP; inv=3.4; rocks.length=0; ufos.length=0; beams.length=0;
  rockTimer=rnd(6,10); ufoTimer=rnd(10,15);
  downEl().classList.remove('on'); updateHearts();
  burst(ship.x,ship.y,'#9ff0d8',44,1.2);
  ripple(ship.x,ship.y,'#7ef0c3',380,3.4);
  toast(ship.x,ship.y-40,'다시 날아올라요!','#7ef0c3');
  if(sound)[392,523,659,784].forEach((f,i)=>beep(f,.36,'sine',.10,i*.10));
}

/* 하트 HUD */
const heartsEl=document.getElementById('hearts'), dmgEl=document.getElementById('dmg');
function updateHearts(hit,dmg=1){
  let h='';
  for(let i=0;i<MAXHP;i++) h+=`<span class="${i<hp?'':'off'}">♥</span>`;
  heartsEl.innerHTML=h;
  if(hit) for(let i=0;i<dmg;i++){              // 깎인 하트 전부 튕기게
    const el=heartsEl.children[Math.max(0,hp)+i]; if(el) el.classList.add('hit'); }
}
let dmgTimer=null;
function dmgFlash(hard){
  dmgEl.classList.toggle('hard',!!hard);
  dmgEl.classList.add('on');
  clearTimeout(dmgTimer); dmgTimer=setTimeout(()=>dmgEl.classList.remove('on'),hard?165:95);
}
function heal(n=1){
  if(hp>=MAXHP) return false;
  hp=Math.min(MAXHP,hp+n); updateHearts();
  const el=heartsEl.children[hp-1]; if(el) el.classList.add('hit');
  beep(880,.14,'sine',.08); beep(1320,.18,'sine',.06,.08);
  return true;
}

/* ── 사운드 ── */
let AC=null, sound=true;
function beep(freq,dur=.16,type='sine',vol=.14,delay=0){
  if(!sound) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    o.frequency.exponentialRampToValueAtTime(freq*1.5,t0+dur);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+.05);
  }catch(e){}
}
function catchSound(rarity,isNew){
  const b={common:520,rare:660,epic:784}[rarity];
  beep(b,.18,'triangle',.12); beep(b*1.5,.24,'sine',.09,.07);
  if(isNew)[0,.12,.24,.38].forEach((d,i)=>beep(b*[1,1.25,1.5,2][i],.32,'sine',.08,.22+d));
}

const cardWrap=document.getElementById('cardWrap'), cardEl=document.getElementById('card');
let cardTimer=null, cardReady=false;
function showCard(e,isNew){
  const R=RARITY[e.r];

  cardEl.innerHTML=`${isNew?'<div class="newbadge">새로 발견!</div>':''}
    <div class="orb" style="background-image:url(${spriteURL(e)})"></div>
    <span class="tag" style="color:${R.color}">${R.name} · ${e.t}</span>
    <h2>${e.ko}</h2><div class="en">${e.en}</div>
    <div class="stats">
      <div><span>크기</span><em>${e.d}</em></div>

      <div><span>거리</span><em>${e.x}</em></div>
    </div>
    <p>${e.f}</p>
    <div class="cardhint">다 읽었으면 <b>화면을 톡</b> 누르세요</div>`;
  const inDex=dexEl.classList.contains('on');

     단 방금 누르던 손가락에 바로 닫히지 않게 아주 짧은 유예를 둡니다. */
  clearTimeout(cardTimer); cardReady=false;

function hideCard(force){
  if(!cardOpen||(!cardReady&&!force)) return;
  clearTimeout(cardTimer); cardOpen=false;
  cardEl.classList.add('out');
  cardWrap.classList.add('closing');                 // 사라지는 동안 바로 아래를 누를 수 있게
  setTimeout(()=>{cardWrap.classList.remove('on','overdex','closing');},320);
  timeScale = dexEl.classList.contains('on') ? 0 : 1;   // 도감에서 열었으면 도감으로 돌아갑니다
}
cardWrap.addEventListener('pointerdown',ev=>{ev.stopPropagation();hideCard();});

function collect(st){
  const e=st.e, isNew=!dex[e.id];
  dex[e.id]=(dex[e.id]||0)+1; save(); updateCounter();
  burst(st.x,st.y,e.c,isNew?56:32,isNew?1.4:1);
  ripple(st.x,st.y,e.c,isNew?340:230,4);
  ripple(st.x,st.y,RARITY[e.r].color,isNew?440:300,2.4,.14);
  ripple(st.x,st.y,'#ffffff',isNew?260:180,1.6,.28);
  catchSound(e.r,isNew); showCard(e,isNew);
  if(isNew && heal(1)) toast(st.x,st.y-40,'체력 회복 ♥','#ff9db6');
  if(target&&target.star===st) target=null;
  if(isNew && prog.zone===KEY_ZONE && e.key && keysGot()<KEY_IDS.length)
    toast(st.x,st.y-72,`열쇠 ${keysGot()} / 3`,'#ffd86a');
  if(isNew && zoneDone(prog.zone)){
    if(ZONES[prog.zone].next) pendingWarp=true;
    else if(prog.zone===KEY_ZONE && !prog.secret) pendingSecret=true;  // 열쇠 3개 완성!
    else if(!prog.finale && Object.keys(dex).length>=CATALOG.length)
      pendingFinale=true;                           // 도감 전체 완성
  }
}

function updateWarp(dt){
  warp.t+=dt;

  ship.y+=Math.sin(ship.a)*warpSpeed()*dt;

    stars.length=0; parts.length=0; rings.length=0; wake.length=0; rocks.length=0;
    ufos.length=0; beams.length=0;
    ship.x=(Math.random()-.5)*60000; ship.y=(Math.random()-.5)*60000;
    hp=MAXHP; inv=3.5; rockTimer=rnd(7,12); updateHearts();   // 새 성역은 만선으로 출발
    ufoTimer = warp.to===UFO_ZONE ? rnd(13,18) : 11;          // 도착하자마자 덮치지 않게
    applyZone(); updateCounter();
  }
  if(warp.t>4.4){ warp=null; banner.classList.remove('on'); }
}
const warpSpeed=()=>{ const t=warp.t;
  return t<2.3 ? 74+Math.pow(t/2.3,3)*5200 : Math.max(74, 5200*Math.pow(1-(t-2.3)/1.6,3)+74); };

  const Z=ZONES[prog.zone];

/* ── 접촉 획득 ── */
function tryCatch(s){                       // 배가 닿았나?
  if(s.caught||cardOpen||warp||downT>0) return false;
  const d=Math.hypot(s.x-ship.x,s.y-ship.y);
  if(d > ASTRO_H*.36+s.size*.36) return false;
  s.caught=.0001;
  ripple(s.x,s.y,s.e.c,s.size*1.8,2.4);
  beep(340,.12,'triangle',.09);
  return true;
}
function reelIn(s,dt,i){                    // 빨려 들어가는 연출
  s.caught+=dt;
  s.x=lerp(s.x,ship.x,1-Math.pow(.02,dt)); s.y=lerp(s.y,ship.y,1-Math.pow(.02,dt));
  s.sc=s.caught<.10 ? 1+s.caught*2.4 : Math.max(.12,1.24-(s.caught-.10)*3.4);
  if(Math.random()<dt*14) ripple(s.x,s.y,s.e.c,s.size*1.4,1.3);
  if(s.caught>.42){ collect(s); stars.splice(i,1); }
}

/* ══════════════════════════════════════════════════════
   조작 — 커서가 곧 방향타
   · 마우스: 커서가 있는 쪽으로 계속 나아감. 중앙에 두면 멈칫, 멀수록 빨라짐.
             클릭하면 잠깐 가속(대시).
   · 터치  : 화면 아무 데나 누르면 그 자리가 조이스틱 중심이 되고,
             끄는 방향·거리로 조종.
   · 키보드: 방향키 / WASD 도 그대로.
   ══════════════════════════════════════════════════════ */
let keys={};
const ptr={active:false, down:false, touch:false, x:0, y:0, ax:0, ay:0};
let aimLock=null, dashT=0, stickFade=0;

const stickMax = ()=> clamp(Math.min(W,H)*.17, 54, 128);
const deadZone = ()=> clamp(Math.min(W,H)*.045, 22, 48);
const fullZone = ()=> Math.min(W,H)*.34;

const dexOn   = ()=> dexEl.classList.contains('on');
const blocked = ()=> cardOpen||warp||downT>0||dexOn()||secretEl.classList.contains('on');
const uiHit   = e => e.target && e.target.closest && e.target.closest('#tools,#dex,#counter,#cardWrap,#map,#secret');

function setPtr(e){
  ptr.x=e.clientX; ptr.y=e.clientY;
  ptr.touch = e.pointerType==='touch'||e.pointerType==='pen';
  ptr.active=true;
  cv.classList.toggle('hidecur',!ptr.touch);      // 마우스는 직접 그린 조준선으로 대체
}
addEventListener('pointerdown',e=>{
  if(!AC) beep(440,.01,'sine',.001);
  if(cardOpen){ hideCard(); return; }            // 어디를 눌러도 카드 닫힘
  if(blocked()||uiHit(e)) return;
  setPtr(e); ptr.down=true;
  if(ptr.touch){ ptr.ax=ptr.x; ptr.ay=ptr.y; stickFade=1; }
  else { dashT=.5; beep(680,.07,'sine',.05); }   // 클릭 = 대시
});
addEventListener('pointermove',e=>{
  if((e.pointerType==='touch'||e.pointerType==='pen') && !ptr.down) return;
  setPtr(e);
  if(ptr.touch&&ptr.down){                       // 멀리 끌면 중심이 따라온다
    const dx=ptr.x-ptr.ax, dy=ptr.y-ptr.ay, d=Math.hypot(dx,dy), M=stickMax();
    if(d>M){ ptr.ax=ptr.x-dx/d*M; ptr.ay=ptr.y-dy/d*M; }
  }
});
function ptrUp(){ ptr.down=false; if(ptr.touch) ptr.active=false; }
addEventListener('pointerup',ptrUp);
addEventListener('pointercancel',ptrUp);
document.addEventListener('mouseleave',()=>{ if(!ptr.touch){ptr.active=false;cv.classList.remove('hidecur');} });
addEventListener('blur',()=>{ptr.down=false;ptr.active=false;keys={};});
addEventListener('keydown',e=>{keys[e.key]=1;});
addEventListener('keyup',e=>{keys[e.key]=0;});

/* 지금 조종 입력 → {ang, power(0~1)} · 입력 없으면 null */
function steerInput(){
  if(blocked()) return null;
  if(ptr.touch){
    if(!ptr.down) return null;
    const dx=ptr.x-ptr.ax, dy=ptr.y-ptr.ay, d=Math.hypot(dx,dy), M=stickMax();
    if(d<9) return null;
    return {ang:Math.atan2(dy,dx), power:Math.min(1,(d-9)/(M-9))};
  }
  if(!ptr.active) return null;
  const dx=ptr.x-W/2, dy=ptr.y-H/2, d=Math.hypot(dx,dy), dz=deadZone();
  if(d<dz) return {ang:Math.atan2(dy,dx), power:0};
  return {ang:Math.atan2(dy,dx), power:Math.min(1,(d-dz)/Math.max(1,fullZone()-dz))};
}

/* 조준 보조 — 가려는 방향 언저리에 별이 있으면 살짝 물어준다 */
function aimAssist(a){
  aimLock=null;
  let best=null, bd=1e9;
  const reach=Math.min(W,H)*.85;
  for(const s of stars){
    if(s.caught) continue;
    const dx=s.x-ship.x, dy=s.y-ship.y, d=Math.hypot(dx,dy);
    if(d<14||d>reach) continue;
    const diff=Math.abs(((Math.atan2(dy,dx)-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI);
    if(diff < .22+Math.atan2(s.size*.5,d) && d<bd){ bd=d; best=s; }
  }
  if(!best) return a;
  aimLock=best;
  return angLerp(a, Math.atan2(best.y-ship.y,best.x-ship.x), .5);
}

/* ── 업데이트 ── */
function update(dt){
  tG+=dt;
  stickFade = (ptr.touch&&ptr.down&&!blocked()) ? 1 : Math.max(0,stickFade-dt*3.2);
  if(warp){ updateWarp(dt); return; }
  if(pendingWarp && !cardOpen && downT<=0){ startWarp(); return; }
  if(pendingSecret && !cardOpen && downT<=0) startSecret();
  if(pendingFinale && !cardOpen && downT<=0) startFinale();

  if(inv>0)   inv  =Math.max(0,inv-dt);
  if(shake>0) shake=Math.max(0,shake-dt*2.1);

  if(downT>0){                                  // ── 표류(기절) 중 ──
    downT-=dt;
    ship.boost=lerp(ship.boost,0,1-Math.pow(.08,dt));
    ship.a+=dt*.55; ship.bob+=dt*1.1;
    ship.x+=Math.cos(ship.a)*ship.speed*ship.boost*dt;
    ship.y+=Math.sin(ship.a)*ship.speed*ship.boost*dt;
    if(downT<=0) revive();
  } else {
    const inp=steerInput();
    const kL=keys.ArrowLeft||keys.a||keys.A, kR=keys.ArrowRight||keys.d||keys.D;
    const kF=keys.ArrowUp||keys.w||keys.W;
    let want=.12;

    if(inp){                                     // ── 커서/스틱 조종 (우선) ──
      aim = aimAssist(inp.ang);
      want = inp.power>0 ? .5+inp.power*2.6 : .1;
    } else if(kL||kR||kF){                       // ── 키보드 ──
      aimLock=null;
      if(kL) aim-=dt*2.6;
      if(kR) aim+=dt*2.6;
      want = kF?2.3 : 1.2;
    } else {                                     // ── 입력 없음: 살랑살랑 표류 ──
      aimLock=null;
      aim+=Math.sin(tG*.17)*dt*.35;
      want=.12;
    }
    if(dashT>0){ dashT=Math.max(0,dashT-dt); want=Math.max(want,3.3); }

    /* 회전 — 이전보다 훨씬 빠르게 돌고, 큰 각도는 최소 각속도로 밀어준다 */
    let da=((aim-ship.a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
    const step=Math.max(Math.abs(da)*(1-Math.pow(.00004,dt)), Math.min(Math.abs(da),dt*3.4));
    ship.a+=Math.sign(da)*step;

    ship.boost=lerp(ship.boost,want,1-Math.pow(.01,dt));
    ship.x+=Math.cos(ship.a)*ship.speed*ship.boost*dt;
    ship.y+=Math.sin(ship.a)*ship.speed*ship.boost*dt;
    ship.bob+=dt*2.4;

    updateRocks(dt);
    updateUfos(dt);
    updateKeys(dt);
  }

  wakeT-=dt;                                    // 별가루 꼬리
  if(wakeT<=0 && ship.boost>.4){
    wakeT=.030/Math.max(.7,ship.boost);
    const bx=ship.x-Math.cos(ship.a)*19, by=ship.y-Math.sin(ship.a)*19;
    const nx=-Math.sin(ship.a), ny=Math.cos(ship.a);
    const n=1+(Math.random()<.55?1:0);
    for(let i=0;i<n;i++){
      const sp=rnd(-7,7);
      wake.push({ x:bx+nx*sp+rnd(-2,2), y:by+ny*sp+rnd(-2,2),
        vx:nx*sp*1.5-Math.cos(ship.a)*rnd(6,26),
        vy:ny*sp*1.5-Math.sin(ship.a)*rnd(6,26),
        r:rnd(.9,2.6), t:0, life:rnd(.9,1.9),
        c:ASTRO_COLS[(Math.random()*ASTRO_COLS.length)|0],
        tw:Math.random()<.32 });
    }
  }
  for(let i=wake.length-1;i>=0;i--){ const w=wake[i]; w.t+=dt;
    w.x+=w.vx*dt; w.y+=w.vy*dt; w.vx*=.965; w.vy*=.965;
    if(w.t>w.life) wake.splice(i,1); }

  const want=Math.min(TARGET_N,zoneCap());         // 중복 없이 채울 수 있는 만큼만
  let guard=0;
  while(stars.length<want && guard++<8){ if(!spawnStar()) break; }
  for(let i=stars.length-1;i>=0;i--){
    const s=stars[i]; s.ph+=dt*1.5; s.ring+=s.spin*dt;
    if(s.caught){ reelIn(s,dt,i); continue; }
    s.x+=s.dx*dt; s.y+=s.dy*dt;
    const dx=ship.x-s.x, dy=ship.y-s.y, d=Math.hypot(dx,dy);
    const MAG=Math.min(W,H)*.26+70;
    if(d<MAG){ const p=1-d/MAG; s.x+=dx/d*p*p*130*dt; s.y+=dy/d*p*p*130*dt; }  // 살짝 끌려옴
    for(let j=0;j<i;j++){                      // 서로 겹치면 살살 밀어냅니다
      const o=stars[j]; if(o.caught) continue;
      const ox=s.x-o.x, oy=s.y-o.y, od=Math.hypot(ox,oy)||1, need=apart(s.size,o.size);
      if(od<need){ const push=(need-od)/need*90*dt;
        s.x+=ox/od*push; s.y+=oy/od*push; o.x-=ox/od*push; o.y-=oy/od*push; }
    }
    if(!tryCatch(s) && d>KEEP && !s.key) stars.splice(i,1);   // 열쇠는 끝까지 기다려 줍니다
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;if(p.t>p.life)parts.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.t+=dt;
    if(r.t>0) r.r=lerp(r.r,r.max,1-Math.pow(.10,dt));
    if(r.t>r.life)rings.splice(i,1);}
  for(let i=toasts.length-1;i>=0;i--){const t=toasts[i];t.t+=dt;t.y-=30*dt;
    if(t.t>t.life)toasts.splice(i,1);}
}

/* ── 운석 업데이트 ── */
function updateRocks(dt){
  rockTimer-=dt;
  if(rockTimer<=0){
    const Q=diff();
    rockTimer=rnd(Q.gap*.72,Q.gap*1.32);
    if(rocks.length<Q.max) spawnRock();
    if(Math.random()<.22+(prog.zone-1)*.14 && rocks.length<Q.max) spawnRock();
    if(prog.zone>=3 && Math.random()<.18 && rocks.length<Q.max) spawnRock();
  }
  const LIMIT=Math.hypot(W,H)*.75+520;
  for(let i=rocks.length-1;i>=0;i--){
    const k=rocks[i];
    k.x+=k.vx*dt; k.y+=k.vy*dt; k.rot+=k.spin*dt;
    const d=Math.hypot(k.x-ship.x,k.y-ship.y);
    if(d>LIMIT){ rocks.splice(i,1); continue; }
    if(!cardOpen && d<k.r+ASTRO_H*.27){          // 충돌!
      if(inv>0){ burst(k.x,k.y,'#ffd9a0',12,.7); beep(520,.07,'sine',.04); }
      else hitShip(k);
      rocks.splice(i,1); continue;
    }
    if(d<k.r+ASTRO_H*.74) k.near=1;              // 스칠 듯 지나감
    else if(k.near && !k.grazed){ k.grazed=1; grazeRock(k); }
  }
}

        w:big?1.5:.9, t:0, life:rnd(1.4,2.5), al:big?.48:rnd(.2,.36),
        c:big?['#bff0ff','#ffe9c8','#ffd4ee'][(Math.random()*3)|0]:'#eaf4ff' });

function drawSky(){
  const cx=W/2, cy=H/2, D=Math.hypot(W,H);
  if(mw){
    const k=mw.t/mw.life;
    const fade=Math.min(1,k*7)*Math.min(1,(1-k)*7);
    const off=lerp(mw.from,mw.to,k)*D*.62;
    const th=H*.30;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(mw.a); ctx.translate(0,off);
    ctx.globalAlpha=fade;
    const g=ctx.createLinearGradient(0,-th,0,th);
    for(const [p,col] of (MWCOL[prog.zone]||MWCOL[1])) g.addColorStop(p,col);
    ctx.fillStyle=g; ctx.fillRect(-D,-th,D*2,th*2);
    const dl=ctx.createLinearGradient(0,-th*.24,0,th*.24);   // 암흑 성간 먼지 띠
    dl.addColorStop(0,'rgba(6,10,30,0)'); dl.addColorStop(.5,'rgba(6,10,30,.34)');
    dl.addColorStop(1,'rgba(6,10,30,0)');

    const rainbow=prog.zone>=3;
    for(const d of mw.dots){
      ctx.fillStyle = rainbow
        ? `hsla(${((d.u*420+mw.t*14)%360)|0},95%,78%,${(d.a*fade*.9).toFixed(3)})`

    g.addColorStop(1,rgba(s.c,0));
    ctx.strokeStyle=g; ctx.lineWidth=s.w; ctx.lineCap='round';

    hg.addColorStop(1,rgba(s.c,0));

/* ── 운석 그리기 (불꼬리 + 울퉁불퉁한 돌덩이) ── */
function drawRock(k){
  const a=Math.atan2(k.vy,k.vx), tl=k.r*(k.big?4.2:3.6);
  const tg=ctx.createLinearGradient(k.x,k.y,k.x-Math.cos(a)*tl,k.y-Math.sin(a)*tl);
  tg.addColorStop(0,'rgba(255,168,84,.55)');
  tg.addColorStop(.45,'rgba(255,108,54,.26)');
  tg.addColorStop(1,'rgba(255,80,40,0)');
  ctx.strokeStyle=tg; ctx.lineWidth=k.r*1.25; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(k.x,k.y);
  ctx.lineTo(k.x-Math.cos(a)*tl,k.y-Math.sin(a)*tl); ctx.stroke();
  ctx.lineCap='butt';

  const gl=ctx.createRadialGradient(k.x,k.y,k.r*.6,k.x,k.y,k.r*2.0);
  gl.addColorStop(0,'rgba(255,140,70,.32)'); gl.addColorStop(1,'rgba(255,110,60,0)');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(k.x,k.y,k.r*2.0,0,7); ctx.fill();

  ctx.save(); ctx.translate(k.x,k.y); ctx.rotate(k.rot);
  ctx.fillStyle=k.col;
  ctx.beginPath();
  k.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  const sh=ctx.createRadialGradient(-k.r*.35,-k.r*.4,k.r*.05,0,0,k.r*1.5);
  sh.addColorStop(0,'rgba(255,236,200,.34)');
  sh.addColorStop(.45,'rgba(255,255,255,0)');
  sh.addColorStop(1,'rgba(2,5,18,.62)');
  ctx.fillStyle=sh; ctx.fillRect(-k.r*1.6,-k.r*1.6,k.r*3.2,k.r*3.2);
  for(const c of k.cr){ ctx.fillStyle='rgba(30,24,20,.42)';
    ctx.beginPath(); ctx.arc(c[0],c[1],c[2],0,7); ctx.fill(); }
  ctx.restore();
  ctx.strokeStyle='rgba(255,170,110,.55)'; ctx.lineWidth=Math.max(1,k.r*.08);
  ctx.beginPath();
  k.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}

/* ── 조작 안내: 마우스 조준선 / 터치 조이스틱 ── */
function drawControlHint(){
  const cx=W/2, cy=H/2;
  if(blocked()) return;

  if(ptr.touch){                                   // 가상 조이스틱
    if(stickFade<=0) return;
    const M=stickMax(), al=stickFade;
    let dx=ptr.x-ptr.ax, dy=ptr.y-ptr.ay, d=Math.hypot(dx,dy);
    if(d>M){ dx=dx/d*M; dy=dy/d*M; d=M; }
    ctx.save();
    ctx.strokeStyle=`rgba(150,215,255,${(.22*al).toFixed(3)})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(ptr.ax,ptr.ay,M,0,7); ctx.stroke();
    ctx.fillStyle=`rgba(120,200,255,${(.07*al).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(ptr.ax,ptr.ay,M,0,7); ctx.fill();
    const g=ctx.createRadialGradient(ptr.ax+dx,ptr.ay+dy,1,ptr.ax+dx,ptr.ay+dy,26);
    g.addColorStop(0,`rgba(190,245,255,${(.85*al).toFixed(3)})`);
    g.addColorStop(1,'rgba(120,220,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ptr.ax+dx,ptr.ay+dy,26,0,7); ctx.fill();
    ctx.fillStyle=`rgba(235,250,255,${(.9*al).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(ptr.ax+dx,ptr.ay+dy,9,0,7); ctx.fill();
    ctx.restore();
    return;
  }

  if(!ptr.active) return;                          // 마우스 조준선
  const dx=ptr.x-cx, dy=ptr.y-cy, d=Math.hypot(dx,dy), dz=deadZone();
  const on=d>=dz, k=.5+.5*Math.sin(tG*3.4);
  ctx.save();
  ctx.strokeStyle=`rgba(150,215,255,${on?.16:.28})`; ctx.lineWidth=1.4;
  ctx.setLineDash([4,6]); ctx.beginPath(); ctx.arc(cx,cy,dz,0,7); ctx.stroke();
  ctx.setLineDash([]);
  if(on){                                          // 우주인 → 커서 가이드 라인
    const ux=dx/d, uy=dy/d;
    const lg=ctx.createLinearGradient(cx+ux*34,cy+uy*34,ptr.x,ptr.y);
    lg.addColorStop(0,'rgba(150,230,255,0)');
    lg.addColorStop(1,`rgba(160,235,255,${(.30+k*.16).toFixed(2)})`);
    ctx.strokeStyle=lg; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(cx+ux*34,cy+uy*34); ctx.lineTo(ptr.x,ptr.y); ctx.stroke();
  }
  const r=10+k*2.4;
  ctx.strokeStyle=`rgba(190,245,255,${(.55+k*.3).toFixed(2)})`; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(ptr.x,ptr.y,r,0,7); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ptr.x-r-6,ptr.y); ctx.lineTo(ptr.x-r-1,ptr.y);
  ctx.moveTo(ptr.x+r+1,ptr.y); ctx.lineTo(ptr.x+r+6,ptr.y);
  ctx.moveTo(ptr.x,ptr.y-r-6); ctx.lineTo(ptr.x,ptr.y-r-1);
  ctx.moveTo(ptr.x,ptr.y+r+1); ctx.lineTo(ptr.x,ptr.y+r+6);
  ctx.stroke();
  ctx.fillStyle=`rgba(235,250,255,${(.5+k*.3).toFixed(2)})`;
  ctx.beginPath(); ctx.arc(ptr.x,ptr.y,2,0,7); ctx.fill();
  ctx.restore();
}

function render(){
  const cx=W/2, cy=H/2;
  const shk=shake*shake;
  const ox=shk?(Math.random()-.5)*24*shk:0, oy=shk?(Math.random()-.5)*24*shk:0;
  ctx.save(); ctx.translate(ox,oy);
  const g=ctx.createLinearGradient(0,0,W*.3,H);
  g.addColorStop(0,THEME.seaTop); g.addColorStop(.55,THEME.seaMid); g.addColorStop(1,THEME.seaBot);
  ctx.fillStyle=g; ctx.fillRect(-30,-30,W+60,H+60);

  for(const n of NEB){
    const x=((n.x*W-ship.x*n.p)%(W*1.4)+W*1.4)%(W*1.4)-W*.2;
    const y=((n.y*H-ship.y*n.p)%(H*1.4)+H*1.4)%(H*1.4)-H*.2;
    const r=Math.max(W,H)*n.r;
    const gr=ctx.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,rgba(n.c,.34)); gr.addColorStop(1,rgba(n.c,0));
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  const wk=warp?Math.min(1,Math.abs(warpSpeed())/2600):0;
  for(const b of BG){
    const x=((b.x*W-ship.x*b.p)%W+W)%W, y=((b.y*H-ship.y*b.p)%H+H)%H;
    const tw=.5+.5*Math.sin(tG*1.8+b.tw);
    if(wk>.02){                                   // 워프 스트릭
      const dx=x-cx, dy=y-cy, d=Math.hypot(dx,dy)||1, len=wk*(60+d*.9);
      const lg=ctx.createLinearGradient(x,y,x+dx/d*len,y+dy/d*len);
      lg.addColorStop(0,`rgba(255,255,255,${(b.a*.9).toFixed(3)})`);
      lg.addColorStop(1,'rgba(160,220,255,0)');
      ctx.strokeStyle=lg; ctx.lineWidth=b.s*1.5;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dx/d*len,y+dy/d*len); ctx.stroke();
    }else{
      ctx.fillStyle=`rgba(255,255,255,${(b.a*tw).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(x,y,b.s,0,7); ctx.fill();
    }
  }

  drawSky();

  ctx.save(); ctx.translate(cx-ship.x, cy-ship.y);

  for(const w of wake){ const k=1-w.t/w.life, al=k*k*.9;
    ctx.globalAlpha=al; ctx.fillStyle=w.c||'#cfc2f5';
    if(w.tw){                                     // 반짝이는 별가루
      const r=w.r*(1.3+k*1.7); ctx.beginPath();
      for(let i=0;i<8;i++){ const rr=i%2?r*.3:r, an=i/8*Math.PI*2-Math.PI/2;
        const X=w.x+Math.cos(an)*rr, Y=w.y+Math.sin(an)*rr;
        i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
      ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(w.x,w.y,w.r*(.45+k*.75),0,7); ctx.fill();
    } }
  ctx.globalAlpha=1;

  for(const r of rings){ if(r.t<0) continue; const k=1-r.t/r.life;
    ctx.strokeStyle=r.c; ctx.globalAlpha=k*.8; ctx.lineWidth=r.w*k+.4;
    ctx.beginPath(); ctx.ellipse(r.x,r.y,r.r,r.r*.36,0,0,7); ctx.stroke(); }
  ctx.globalAlpha=1;

  if(aimLock && stars.indexOf(aimLock)>=0){        // 조준 보조로 물린 별
    const k=.5+.5*Math.sin(tG*5), R=Math.max(24,aimLock.size*.55)+k*7;
    ctx.strokeStyle=`rgba(190,240,255,${(.30+k*.32).toFixed(2)})`; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.ellipse(aimLock.x,aimLock.y,R,R*.36,0,0,7); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(aimLock.x,aimLock.y,R*.5,R*.18,0,0,7); ctx.stroke(); }

  for(const s of stars) drawPlanet(s);

  for(const k of rocks) drawRock(k);
  for(const u of ufos){ drawAim(u); drawUfo(u); }
  for(const b of beams) drawBeam(b);

  for(const p of parts){ const k=1-p.t/p.life;
    ctx.globalAlpha=k; ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*k,0,7); ctx.fill(); }
  ctx.globalAlpha=1;

  if(toasts.length){                                   // 떠오르는 글씨
    ctx.textAlign='center';
    ctx.font=`800 ${Math.round(19*UI)}px "Pretendard","Malgun Gothic",system-ui,sans-serif`;
    for(const t of toasts){ const k=1-t.t/t.life;
      ctx.globalAlpha=Math.min(1,k*2.4);
      ctx.lineWidth=4; ctx.strokeStyle='rgba(4,10,28,.75)';
      ctx.strokeText(t.txt,t.x,t.y); ctx.fillStyle=t.c; ctx.fillText(t.txt,t.x,t.y); }
    ctx.globalAlpha=1; ctx.textAlign='left';
  }

  ctx.restore();

  // ── 우주인 ──
  const bobY=cy+Math.sin(ship.bob)*2.8;
  const au=ctx.createRadialGradient(cx,bobY+4,3,cx,bobY+4,44);   // 발밑 아우라
  au.addColorStop(0,'rgba(158,134,240,.38)'); au.addColorStop(1,'rgba(150,126,232,0)');
  ctx.fillStyle=au; ctx.beginPath(); ctx.arc(cx,bobY+4,44,0,7); ctx.fill();

  const blink = inv>0 && Math.floor(tG*13)%2===0 ? .34 : 1;
  ctx.globalAlpha=blink;
  if(inv>0){                                           // 보호막
    const p=.55+.45*Math.sin(tG*7);
    ctx.strokeStyle=`rgba(150,235,255,${(.28+p*.3).toFixed(2)})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,32+p*3,0,7); ctx.stroke();
  }
  // 표류 중엔 빙글빙글 돌고, 평소엔 살랑살랑
  const extra = downT>0 ? tG*3.4 : Math.sin(ship.bob*.8)*.06;
  drawAstro(cx, bobY, ship.a, extra);
  ctx.globalAlpha=1;

  ctx.restore();            // 화면 흔들림 해제
  drawWarnings();
  drawControlHint();

  // 그레인 + 비네트
  if(!grainPat) grainPat=ctx.createPattern(grain,'repeat');
  ctx.globalAlpha=.05; ctx.fillStyle=grainPat; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  const vg=ctx.createRadialGradient(cx,cy,Math.min(W,H)*.35,cx,cy,Math.max(W,H)*.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(2,5,18,.62)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  if(warp){
    const f = warp.t<2.3 ? Math.max(0,(warp.t-1.85)/.45) : Math.max(0,1-(warp.t-2.3)/1.0);
    if(f>0){ ctx.fillStyle=`rgba(235,248,255,${(f*.9).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  }
}

/* ── 우주지도 ── */
const rc=document.getElementById('radar').getContext('2d');
function drawRadar(){
  const S=304,c=S/2;
  rc.clearRect(0,0,S,S);
  rc.save(); rc.beginPath(); rc.arc(c,c,c-5,0,7); rc.clip();
  const g=rc.createRadialGradient(c,c,10,c,c,c);
  g.addColorStop(0,'rgba(18,52,116,.9)'); g.addColorStop(1,'rgba(4,10,32,.94)');
  rc.fillStyle=g; rc.fillRect(0,0,S,S);
  rc.strokeStyle='rgba(140,200,255,.16)'; rc.lineWidth=1.5;
  for(let i=1;i<=3;i++){rc.beginPath();rc.arc(c,c,(c-9)*i/3,0,7);rc.stroke();}
  rc.beginPath();rc.moveTo(c,9);rc.lineTo(c,S-9);rc.moveTo(9,c);rc.lineTo(S-9,c);rc.stroke();
  const sa=tG*1.1;
  const sg=rc.createRadialGradient(c,c,0,c,c,c);
  sg.addColorStop(0,'rgba(120,235,240,.30)'); sg.addColorStop(1,'rgba(120,235,240,0)');
  rc.fillStyle=sg; rc.beginPath(); rc.moveTo(c,c); rc.arc(c,c,c,sa-.55,sa); rc.closePath(); rc.fill();
  rc.strokeStyle='rgba(150,245,250,.5)'; rc.lineWidth=2;
  rc.beginPath(); rc.moveTo(c,c); rc.lineTo(c+Math.cos(sa)*c,c+Math.sin(sa)*c); rc.stroke();
  for(const s of stars){
    const dx=s.x-ship.x, dy=s.y-ship.y, d=Math.hypot(dx,dy); if(d>RANGE) continue;
    const k=(c-12)/RANGE, x=c+dx*k, y=c+dy*k, pl=1+Math.sin(tG*4+s.ph)*.24;
    rc.fillStyle=s.e.c; rc.shadowColor=s.e.c; rc.shadowBlur=11;
    rc.beginPath(); rc.arc(x,y,(s.e.r==='myth'?7:s.e.r==='epic'?5.4:s.e.r==='rare'?4.2:3.3)*pl,0,7); rc.fill();
    rc.shadowBlur=0;
  }
  for(const k of rocks){                      // 운석 — 진행 방향까지 표시
    const dx=k.x-ship.x, dy=k.y-ship.y, d=Math.hypot(dx,dy); if(d>RANGE) continue;
    const kk=(c-12)/RANGE, x=c+dx*kk, y=c+dy*kk, pl=1+Math.sin(tG*7)*.22;
    rc.strokeStyle='rgba(255,122,92,.55)'; rc.lineWidth=2;
    rc.beginPath(); rc.moveTo(x,y); rc.lineTo(x+k.vx*kk*2.2,y+k.vy*kk*2.2); rc.stroke();
    rc.fillStyle='#ff7a5c'; rc.shadowColor='#ff7a5c'; rc.shadowBlur=11;
    rc.beginPath(); rc.arc(x,y,(k.big?5.6:4.2)*pl,0,7); rc.fill();
    rc.shadowBlur=0;
  }
  for(const s of stars){                      // 열쇠 — 금빛으로 크게 깜빡임
    if(!s.key) continue;
    const dx=s.x-ship.x, dy=s.y-ship.y, d=Math.hypot(dx,dy);
    const kk=(c-12)/RANGE;
    let x=c+dx*kk, y=c+dy*kk;
    if(d>RANGE){ const t=(c-14)/d; x=c+dx*t; y=c+dy*t; }   // 범위 밖이면 가장자리에
    const pl=1+Math.sin(tG*4.5)*.3;
    rc.strokeStyle=`rgba(255,216,106,${(.45+.4*Math.sin(tG*4.5)).toFixed(2)})`; rc.lineWidth=2.5;
    rc.beginPath(); rc.arc(x,y,12*pl,0,7); rc.stroke();
    rc.fillStyle='#ffd86a'; rc.shadowColor='#ffd86a'; rc.shadowBlur=16;
    rc.beginPath(); rc.arc(x,y,5.4*pl,0,7); rc.fill();
    rc.shadowBlur=0;
  }
  for(const u of ufos){                       // UFO — 깜빡이는 초록 고리
    const dx=u.x-ship.x, dy=u.y-ship.y, d=Math.hypot(dx,dy); if(d>RANGE) continue;
    const kk=(c-12)/RANGE, x=c+dx*kk, y=c+dy*kk, pl=1+Math.sin(tG*5.5)*.32;
    rc.strokeStyle=`rgba(126,240,195,${(.35+.35*Math.sin(tG*5.5)).toFixed(2)})`; rc.lineWidth=2;
    rc.beginPath(); rc.arc(x,y,9*pl,0,7); rc.stroke();
    rc.fillStyle='#7ef0c3'; rc.shadowColor='#7ef0c3'; rc.shadowBlur=13;
    rc.beginPath(); rc.ellipse(x,y,6*pl,2.6*pl,0,0,7); rc.fill();
    rc.shadowBlur=0;
  }
  rc.save(); rc.translate(c,c); rc.rotate(ship.a+Math.PI/2);
  rc.fillStyle='#fff'; rc.shadowColor='#9fe8ff'; rc.shadowBlur=12;
  rc.beginPath(); rc.moveTo(0,-12); rc.lineTo(7.5,9); rc.lineTo(0,4.5); rc.lineTo(-7.5,9);
  rc.closePath(); rc.fill(); rc.restore();
  rc.restore();
  rc.strokeStyle='rgba(170,220,255,.45)'; rc.lineWidth=4;
  rc.beginPath(); rc.arc(c,c,c-5,0,7); rc.stroke();
}
const sectorEl=document.getElementById('sector');

/* ── HUD / 도감 ── */
const cGot=document.getElementById('cGot'), cBar=document.getElementById('cBar'),
      cAll=document.getElementById('cAll'), cTotal=document.getElementById('cTotal'),
      zoneNum=document.getElementById('zoneNum'), cLeft=document.getElementById('cLeft');
function updateCounter(){
  const list=zoneList(prog.zone), got=zoneGot(prog.zone), left=list.length-got;
  cGot.textContent=got; cAll.textContent=list.length;
  cTotal.textContent=`${Object.keys(dex).length}/${CATALOG.length}`;
  cBar.style.width=(got/list.length*100)+'%';
  zoneNum.textContent=prog.zone;
  cLeft.textContent = prog.zone===KEY_ZONE ? `· 🔑 ${keysGot()} / 3`
                    : left===0 ? '· 제패!'
                    : left<=5 ? `· 다음 우주까지 ${left}종!` : '';
}

const dexEl=document.getElementById('dex'), grid=document.getElementById('dexGrid'),
      dexCount=document.getElementById('dexCount');
function buildDex(){
  const n=Object.keys(dex).length;
  dexCount.textContent=`${n} / ${CATALOG.length} 종 수집`;
  const cellHTML=(e,open)=>{
    const c=dex[e.id];
    if(!c) return `<div class="cell lock"><div class="o"></div><b>???</b>
      <i>${open?RARITY[e.r].name:'???'}</i></div>`;
    return `<div class="cell got" data-id="${e.id}">
      <div style="position:relative;width:54px;margin:0 auto">
        <div class="o" style="background-image:url(${spriteURL(e)})"></div>
        ${c>1?`<span class="cnt">${c}</span>`:''}
      </div><b>${e.ko}</b><i style="color:${RARITY[e.r].color}">${e.t}</i></div>`;
  };
  let html='';
  const sp=CATALOG.filter(e=>e.z===0);
  html+=`<div class="zsec"><div class="zhead"><b>✦ 특별한 별</b><u>SPECIAL</u>
    ${sp.every(e=>dex[e.id])?'<span class="done">만났다!</span>':''}
    <span class="p">${sp.filter(e=>dex[e.id]).length} / ${sp.length}</span></div>
    <div class="g">${sp.map(e=>cellHTML(e,true)).join('')}</div></div>`;
  for(let z=1;z<ZONES.length;z++){
    const Z=ZONES[z], list=zoneList(z), got=zoneGot(z), open=prog.zone>=z;
    html+=`<div class="zsec"><div class="zhead">
      <b>LV${z} · ${Z.name}</b><u>${Z.sub}</u>
      ${open?(got===list.length?'<span class="done">제패 완료</span>':'')
            :'<span class="lockmark">미개방 성역</span>'}
      <span class="p">${got} / ${list.length}</span></div><div class="g">`;
    html+=list.map(e=>cellHTML(e,open)).join('');
    html+='</div></div>';
  }
  grid.innerHTML=html;
}
grid.addEventListener('click',ev=>{
  const cell=ev.target.closest('.cell.got'); if(!cell) return;
  showCard(BY_ID[cell.dataset.id], false);      // 별을 잡았을 때와 똑같은 카드로
  beep(620,.1,'sine',.07);
});
const btnSecret=document.getElementById('btnSecret');
btnSecret.onclick=()=>openSecret(true);
const openDex=()=>{buildDex();btnSecret.hidden=!prog.secret;
  dexEl.classList.add('on');timeScale=0;};
const closeDex=()=>{dexEl.classList.remove('on');timeScale=cardOpen?.12:1;};
document.getElementById('btnDex').onclick=openDex;
document.getElementById('btnClose').onclick=closeDex;
addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(secretEl.classList.contains('on')){closeSecret();return;}
    closeDex();hideCard(true);}
  if(e.key==='Tab'){e.preventDefault(); dexEl.classList.contains('on')?closeDex():openDex();}
});
const btnSound=document.getElementById('btnSound');
btnSound.onclick=()=>{sound=!sound;btnSound.textContent=sound?'🔊':'🔇';};
const NARROW = Math.min(innerWidth,innerHeight) < 400;    // 좁은 폰에선 짧게
document.getElementById('hintTxt').innerHTML = IS_TOUCH
  ? (NARROW ? '화면을 <b>누른 채 끌면</b> 날아가요 · <b>운석</b>은 피하세요!'
            : '화면을 <b>누른 채 끌면</b> 그 방향으로 날아가요 · 우주인이 닿으면 별이 잡혀요 · <b>운석</b>은 피하세요!')
  : '<b>마우스를 두는 쪽</b>으로 계속 날아가요 · 가운데에 두면 멈춰요 · 클릭하면 <b>가속</b> · <b>운석</b>은 피하세요!';
setTimeout(()=>{document.getElementById('hint').style.opacity='0';},11000);

/* ── 시작 ── */
applyZone(); updateCounter(); updateHearts();
rockTimer=rnd(8,13);                       // 시작하자마자 맞지 않도록 여유
if(zoneDone(prog.zone) && ZONES[prog.zone].next) pendingWarp=true;

/* ── 루프 ── */
const dotsEl=document.getElementById('downDots');
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05); last=now;
  update(dt*timeScale); updateSky(dt); render(); drawRadar();
  sectorEl.textContent=`SECTOR ${Math.round(ship.x/2000)} : ${Math.round(ship.y/2000)}`;
  if(downT>0) dotsEl.textContent=['·','· ·','· · ·'][Math.floor(tG*3)%3];
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
